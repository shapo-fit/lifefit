<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הלוח של החבר'ה</title>
<meta name="description" content="רושמים אימונים, משתפים ולומדים אחד מהשני">

<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Heebo:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column phone app, bottom tab bar; formats colour-coded like bumper plates (red/blue/yellow/green) */
:root{
  --bg:#ECEFEF; --surface:#FFFFFF; --ink:#14191C; --muted:#5E6A70; --line:#D3D9DB;
  --red:#C8243A; --blue:#1F5FBF; --yellow:#E2A900; --green:#2E8B57;
  --accent:var(--red); --chip-ink:#FFFFFF; --shadow:0 1px 0 rgba(20,25,28,.06),0 6px 18px -10px rgba(20,25,28,.25);
  --f-display:"Karantina","Heebo",system-ui,sans-serif;
  --f-body:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101416; --surface:#1A2024; --ink:#E8EDEE; --muted:#93A0A6; --line:#2A3338;
  --red:#E5485E; --blue:#5B93E8; --yellow:#F2C230; --green:#4CB37A; --chip-ink:#0E1214;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 20px -12px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101416; --surface:#1A2024; --ink:#E8EDEE; --muted:#93A0A6; --line:#2A3338;
  --red:#E5485E; --blue:#5B93E8; --yellow:#F2C230; --green:#4CB37A; --chip-ink:#0E1214;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 20px -12px rgba(0,0,0,.7); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 110px;display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:.9;letter-spacing:.5px}
.brand small{display:block;font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
.me{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;color:var(--muted);text-align:left}
.me b{font-family:var(--f-num);font-size:22px;color:var(--ink);font-weight:600}
.banner{background:color-mix(in srgb,var(--yellow) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--yellow) 55%,var(--line));border-radius:10px;padding:10px 12px;font-size:13px}
h2.sec{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;margin:6px 0 0;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.4px;padding:2px 9px;border-radius:999px;color:var(--chip-ink);white-space:nowrap}
.chip.time{background:var(--red)} .chip.amrap{background:var(--blue)} .chip.strength{background:var(--yellow);color:#1b1500} .chip.rx{background:transparent;color:var(--ink);border:1.5px solid var(--ink);padding:1px 7px}
.chip.wod{background:var(--green)}
/* WOD whiteboard */
.board{position:relative;overflow:hidden;padding:18px 16px 16px}
.board::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:6px;background:var(--fmt,var(--red))}
.board .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.board h3{font-family:var(--f-display);font-size:40px;line-height:.95;margin:8px 0 6px;font-weight:700}
.board .lines{font-family:var(--f-body);white-space:pre-wrap;margin:0;font-size:16px;line-height:1.65}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.hf:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* leaderboard */
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lb li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.lb li:last-child{border-bottom:0}
.lb .pos{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--muted);text-align:center}
.lb li:first-child .pos{color:var(--red)}
.lb .who{min-width:0}
.lb .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .who span{font-size:12px;color:var(--muted)}
.lb .score{font-family:var(--f-num);font-weight:600;font-size:17px;direction:ltr;text-align:left}
.me-row{background:color-mix(in srgb,var(--blue) 8%,transparent);border-radius:8px}
/* feed */
.feed{display:flex;flex-direction:column;gap:12px}
.post .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.post .head b{font-size:15px}
.post .ago{font-size:12px;color:var(--muted)}
.post .title{margin:6px 0 4px;font-weight:500}
.post .result{font-family:var(--f-num);font-size:26px;font-weight:600;direction:ltr;text-align:right;unicode-bidi:isolate}
.post .result small{font-size:13px;color:var(--muted);font-weight:500}
.post .notes{color:var(--muted);font-size:14px;margin-top:4px}
.post .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.hf{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.hf.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.del{font:inherit;font-size:12px;background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
.rules{font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px}
.rules b{font-family:var(--f-num);color:var(--ink);direction:ltr;text-align:left}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-num);font-size:24px;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
/* tab bar */
nav.tabs{position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
nav.tabs .inner{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr 1fr;gap:4px;width:100%;max-width:560px;align-items:center}
.tab{font:inherit;font-size:13px;font-weight:500;background:none;border:0;color:var(--muted);padding:8px 4px;border-radius:8px;cursor:pointer}
.tab[aria-current="page"]{color:var(--ink);font-weight:700;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tab.log{order:-1;background:var(--red);color:#fff;font-weight:700;font-size:14px}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,12,14,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-family:var(--f-display);font-size:34px;margin:0;line-height:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 4px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--fmt);background:color-mix(in srgb,var(--fmt) 14%,var(--surface))}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pair input{text-align:center;font-family:var(--f-num)}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:28px 1fr auto 1fr 28px;gap:6px;align-items:center}
.setrow input{text-align:center;font-family:var(--f-num);padding:8px}
.setrow .n{font-family:var(--f-num);color:var(--muted);text-align:center}
.x{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
.x:disabled{opacity:.3;cursor:default}
.exlist{display:flex;flex-direction:column;gap:10px}
.exblock{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.exhead{display:grid;grid-template-columns:28px minmax(0,1fr) 28px;gap:6px;align-items:center}
.exn{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1;text-align:center;color:var(--yellow)}
.exhead input{font-weight:700}
.setrow.lbl{font-size:12px;color:var(--muted)} .setrow.lbl span{text-align:center}
.hint{font-size:12px;color:var(--muted)}
.extable{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.extable li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.extable li:last-child{border-bottom:0}
.exname{font-weight:500;min-width:0}
.exsets{font-size:14px;white-space:nowrap;color:var(--ink)}
.exsum{font-size:12px;color:var(--muted);margin-top:4px}
div.plan{white-space:pre-wrap;text-align:start;margin:6px 0 4px;padding:8px 10px;background:color-mix(in srgb,var(--ink) 4%,transparent);border-radius:8px;font-size:14px;line-height:1.6}
.based{font-size:12px;color:var(--muted);margin-top:-2px}
.copies{font-size:12px;color:var(--green);font-weight:700;margin-top:8px}
.hf.do{border-color:var(--ink);font-weight:700}
.quickrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1.2fr);gap:6px;align-items:end}
.quickrow label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);text-align:center}
.quickrow input{text-align:center;font-family:var(--f-num);padding:9px 4px}
.quickrow .op{font-family:var(--f-num);color:var(--muted);padding-bottom:10px}
.exfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.last{font-size:12px;color:var(--green);font-weight:500;min-width:0}
.linkbtn{font:inherit;font-size:13px;background:none;border:0;color:var(--blue);cursor:pointer;padding:2px 0;font-weight:500}
.tpl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.savedhint{font-size:12px;color:var(--muted);text-align:center}
.btn:disabled{opacity:.6;cursor:default}
.prs .pos{color:var(--yellow)!important;font-size:20px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:20px;height:20px}
.err{color:var(--red);font-size:13px;min-height:1em}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:20}
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:32px}
.gatebox{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;text-align:center}
.gateicon{border-radius:18px;align-self:center}
.gatebox .brand{margin:0;font-size:52px}
.gatesub{color:var(--muted);margin:0}
.gatesub.small{font-size:13px}
.gateform{display:flex;flex-direction:column;gap:12px;text-align:start}
.seg.two{grid-template-columns:1fr 1fr;--fmt:var(--red)}
.install{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.install span{font-size:13px;color:var(--muted)}
.settings{display:flex;flex-direction:column;gap:12px}
.pend{color:var(--yellow);font-weight:700}
.pastebtn{font:inherit;text-align:start;display:flex;flex-direction:column;gap:2px;width:100%;padding:12px 14px;border:1.5px dashed color-mix(in srgb,var(--blue) 55%,var(--line));border-radius:12px;background:color-mix(in srgb,var(--blue) 6%,var(--surface));color:var(--ink);cursor:pointer}
.pastebtn span{font-size:12px;color:var(--muted)}
.pastebox{display:flex;flex-direction:column;gap:8px;padding:12px;border:1.5px solid color-mix(in srgb,var(--blue) 45%,var(--line));border-radius:12px;background:var(--surface)}
.pastebox textarea{min-height:120px;font-size:15px}
.howto{font-size:13px;color:var(--muted)} .howto summary{cursor:pointer;color:var(--blue)} .howto p{margin:6px 0}
.banner.ok{background:color-mix(in srgb,var(--green) 14%,var(--surface));border-color:color-mix(in srgb,var(--green) 50%,var(--line))}
.members .dot{font-size:14px;color:var(--yellow)!important}
.members .dot.on{color:var(--green)!important}
.members .dot.off{color:var(--line)!important}
.lb .score.small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted);direction:rtl;text-align:left;white-space:nowrap}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

<body>
<div id="gate" class="gate" dir="rtl" hidden></div>
<div class="app" dir="rtl" id="app" hidden>
  <header class="top">
    <div class="brand">הלוח של החבר'ה<small id="sub">טוען…</small></div>
    <div class="me"><span>הנקודות שלך החודש</span><b id="myPts" class="num">–</b></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
</div>

<nav class="tabs" id="tabs" dir="rtl" aria-label="ניווט" hidden>
  <div class="inner">
    <button class="tab" id="t-feed" data-tab="feed">פיד</button>
    <button class="tab" id="t-wod" data-tab="wod">אתגר</button>
    <button class="tab" id="t-rank" data-tab="rank">דירוג</button>
    <button class="tab" id="t-mine" data-tab="mine">שלי</button>
    <button class="tab log" id="t-log" data-act="log">+ רישום</button>
  </div>
</nav>

<div id="sheetHost"></div>
<div id="toast" class="toast" hidden></div>

<script>
document.documentElement.lang="he";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FMT={time:{he:"FOR TIME",color:"var(--red)"},amrap:{he:"AMRAP",color:"var(--blue)"},strength:{he:"כוח",color:"var(--yellow)"}};
const DAY=864e5;

/* ---------- state ---------- */
const S={tab:"feed",filter:"all",mode:"loading",connErr:false,members:[],sb:null,session:null,pending:0,failed:0,meId:null,meName:"",workouts:[],wods:[],names:{},db:null,user:null};
try{const t=localStorage.getItem("wb.tab");if(t)S.tab=t}catch(e){}

/* ---------- dates (Israeli week: Sunday start) ---------- */
const dayKey=ms=>{const d=new Date(ms);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const weekStart=ms=>{const d=new Date(ms);d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d.getTime()};
const monthStart=ms=>{const d=new Date(ms);return new Date(d.getFullYear(),d.getMonth(),1).getTime()};
function ago(ms){const m=Math.round((Date.now()-ms)/6e4);if(m<1)return"עכשיו";if(m<60)return"לפני "+m+" דק'";const h=Math.round(m/60);if(h<24)return"לפני "+h+" שע'";const d=Math.round(h/24);if(d===1)return"אתמול";if(d<7)return"לפני "+d+" ימים";return new Date(ms).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})}
const mmss=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

/* ---------- scoring ---------- */
function resultText(w){
  const r=w.result||{};
  if(w.format==="time") return r.capped?`CAP + ${r.reps||0} <small>reps</small>`:mmss(r.seconds||0);
  if(w.format==="amrap") return `${r.rounds||0}+${r.reps||0} <small>rounds+reps</small>`;
  const ex=exercisesOf(w);const m=ex[0];if(!m)return"–";
  const top=topKg(m);
  return `${top?top+"<small>kg</small>":"BW"} <small>${esc(m.name)}${ex.length>1?` +${ex.length-1}`:""}</small>`;
}
// strength: list of exercises; older entries stored a single `sets` list under the workout title
function exercisesOf(w){
  const r=w.result||{};
  if(Array.isArray(r.exercises))return r.exercises;
  if(Array.isArray(r.sets))return[{name:w.title,sets:r.sets}];
  return[];
}
const topKg=e=>Math.max(0,...(e.sets||[]).map(s=>+s.kg||0));
// "5,5,5" -> "3×5", "5,3,1" -> "5/3/1"
function setsLine(e){
  const sets=e.sets||[];if(!sets.length)return"";
  const reps=sets.map(s=>s.reps);const same=reps.every(r=>r===reps[0]);
  const scheme=same?`${sets.length}×${reps[0]}`:reps.join("/");
  const kgs=sets.map(s=>+s.kg||0);const kSame=kgs.every(k=>k===kgs[0]);
  const load=!kgs.some(Boolean)?"BW":kSame?`${kgs[0]}kg`:`${Math.min(...kgs)}–${Math.max(...kgs)}kg`;
  return `${scheme} · ${load}`;
}
// higher = better
function rankValue(w){
  const r=w.result||{};const rx=w.rx?1e9:0;
  if(w.format==="time") return rx+(r.capped?(r.reps||0):1e6-(r.seconds||0));
  if(w.format==="amrap") return rx+(r.rounds||0)*1000+(r.reps||0);
  // strength WOD: ranked by the top weight on the first (main) lift
  const m=exercisesOf(w)[0];return m?topKg(m):0;
}
function pointsFor(uid,now=Date.now()){
  const ms0=monthStart(now);
  const mine=S.workouts.filter(w=>w.userId===uid&&w.createdAt>=ms0);
  const days=new Set(mine.map(w=>dayKey(w.createdAt)));
  const wods=new Set(mine.filter(w=>w.wodId).map(w=>w.wodId));
  const weeks={};mine.forEach(w=>{const k=weekStart(w.createdAt);(weeks[k]=weeks[k]||new Set()).add(dayKey(w.createdAt))});
  const fullWeeks=Object.values(weeks).filter(s=>s.size>=3).length;
  // a friend did one of your workouts this month (each friend counts once per workout)
  const pairs=new Set(S.workouts.filter(w=>w.createdAt>=ms0&&w.copiedFrom&&w.copiedFrom.userId===uid&&w.userId!==uid).map(w=>w.copiedFrom.id+"|"+w.userId));
  return {days:days.size,wods:wods.size,weeks:fullWeeks,copied:pairs.size,total:days.size*10+wods.size*5+fullWeeks*20+pairs.size*5};
}
function streak(uid){
  const byWeek={};S.workouts.filter(w=>w.userId===uid).forEach(w=>{const k=weekStart(w.createdAt);(byWeek[k]=byWeek[k]||new Set()).add(dayKey(w.createdAt))});
  let k=weekStart(Date.now()),n=0;
  if(!(byWeek[k]&&byWeek[k].size>=3)) k-=7*DAY;
  while(byWeek[k]&&byWeek[k].size>=3){n++;k=weekStart(k-3*DAY)}
  return n;
}

let draft=null;
const DRAFT_KEY="wb.draft.v2";
const normName=n=>String(n||"").trim().toLowerCase().replace(/\s+/g," ");
const MAX_EX=8;
// simple mode: one line "sets × reps @ kg"; detail mode: one row per set
const newEx=()=>({name:"",detail:false,n:"3",reps:"",kg:"",sets:[],last:""});
const toSets=e=>e.detail?e.sets:Array.from({length:Math.max(1,parseInt(e.n)||1)},()=>({reps:e.reps,kg:e.kg}));
function fromSets(name,sets){
  const same=sets.every(s=>+s.reps===+sets[0].reps&&(+s.kg||0)===(+sets[0].kg||0));
  const ex=newEx();ex.name=name;
  if(same&&sets.length){ex.n=String(sets.length);ex.reps=String(sets[0].reps);ex.kg=sets[0].kg?String(sets[0].kg):"";}
  else{ex.detail=true;ex.sets=sets.map(s=>({reps:String(s.reps),kg:s.kg?String(s.kg):""}));}
  return ex;
}
function lastTime(name){
  const k=normName(name);if(!k)return null;
  for(const w of myHistory()){if(w.format!=="strength")continue;const e=exercisesOf(w).find(e=>normName(e.name)===k);if(e)return{e,at:w.createdAt};}
  return null;
}
function myExerciseNames(){
  const cnt={};myHistory().forEach(w=>w.format==="strength"&&exercisesOf(w).forEach(e=>{const k=normName(e.name);cnt[k]=cnt[k]||{name:e.name,n:0};cnt[k].n++}));
  const mine=Object.values(cnt).sort((a,b)=>b.n-a.n).map(x=>x.name);
  const seen=new Set(mine.map(normName));
  return mine.concat(EX_LIB.filter(n=>!seen.has(normName(n))));
}
function myRecentTemplates(){
  const seen=new Set(),out=[];
  for(const w of myHistory()){if(w.format!=="strength"||w.wodId)continue;const k=normName(w.title);if(seen.has(k))continue;seen.add(k);out.push(w);if(out.length>=4)break;}
  return out;
}
function saveDraftLocal(){
  if(!draft)return;try{localStorage.setItem(DRAFT_KEY,JSON.stringify({at:Date.now(),d:draft}))}catch(e){}
}
function clearDraftLocal(){try{localStorage.removeItem(DRAFT_KEY)}catch(e){}}
function loadDraftLocal(){
  try{const x=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");if(x&&x.d&&Date.now()-x.at<18*36e5&&!x.d.wodId)return x.d}catch(e){}
  return null;
}
function draftHasContent(d){return !!(d.title.trim()||d.plan.trim()||d.notes.trim()||d.exercises.some(e=>e.name.trim()))}
function blankDraft(){return{wodId:null,format:"strength",title:"",plan:"",amrapMin:"",rx:true,capped:false,min:"",sec:"",reps:"",rounds:"",exercises:[newEx(),newEx(),newEx()],notes:"",copiedFrom:null,restored:false,fromMine:false}}
function openLog(wod,src){
  draft=blankDraft();
  if(wod)Object.assign(draft,{wodId:wod.id,format:wod.format,title:wod.title,plan:wod.description,amrapMin:wod.format==="amrap"&&wod.cap?String(wod.cap):""});
  else if(src){
    const mine=src.userId===S.meId;
    Object.assign(draft,{format:src.format,title:src.title,plan:src.plan||"",amrapMin:src.durationMin?String(src.durationMin):"",copiedFrom:mine?null:{id:src.id,userId:src.userId},fromMine:mine});
    if(src.format==="strength")draft.exercises=exercisesOf(src).map(e=>fromSets(e.name,e.sets));
  }else{

  }
  drawLog();
}

// Every workout gets its id on the phone and goes into an outbox first.
// If there is no reception at the gym it waits there and is sent later; a retry never duplicates it.
const OUTBOX_KEY="wb.outbox.v1";
function readOutbox(){try{return JSON.parse(localStorage.getItem(OUTBOX_KEY)||"[]")}catch(e){return[]}}
function writeOutbox(list){try{localStorage.setItem(OUTBOX_KEY,JSON.stringify(list))}catch(e){}}
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));
function toRow(w){
  return{id:w.id,user_id:w.userId,created_at:new Date(w.createdAt).toISOString(),format:w.format,title:w.title,rx:!!w.rx,result:w.result,notes:w.notes||"",
    plan:w.plan||null,duration_min:w.durationMin||null,wod_id:w.wodId||null,
    copied_from_id:w.copiedFrom?w.copiedFrom.id||null:null,copied_from_user:w.copiedFrom?w.copiedFrom.userId||null:null};
}
let flushing=false;
async function flushOutbox(){
  if(flushing||!S.sb||!S.meId)return;
  let box=readOutbox().filter(x=>x.user_id===S.meId);if(!box.length){S.pending=0;S.failed=0;render();return}
  flushing=true;let failed=0;
  for(const row of box){
    const {error}=await S.sb.from("workouts").upsert(row,{onConflict:"id",ignoreDuplicates:true});
    if(!error){writeOutbox(readOutbox().filter(x=>x.id!==row.id))}
    else if(isNetworkError(error)){break}
    else{failed++;console.warn("save failed",error)}
  }
  flushing=false;
  const left=readOutbox().filter(x=>x.user_id===S.meId);
  S.pending=left.length;S.failed=failed;
  if(!left.length||left.length<box.length)scheduleRefetch(0);else render();
}
function isNetworkError(error){
  const m=String(error&&(error.message||error)||"");
  return !navigator.onLine||/fetch|network|Failed to fetch|Load failed|timeout/i.test(m)||error.code===""||error.status===0;
}

async function saveWorkout(){
  readDraft();const d=draft;const err=$("#err");
  if(d.format!=="strength"&&!d.title.trim()){err.textContent="תן לאימון שם, למשל Fran או מטקון של שישי.";return}
  let result;
  if(d.format!=="strength"&&!d.plan.trim()){err.textContent="כתוב מה היה באימון, כדי שהחברים יוכלו ללמוד ממנו ולעשות אותו.";return}
  if(d.format==="time"){
    if(d.capped){result={capped:true,reps:Math.max(0,parseInt(d.reps)||0)}}
    else{const s=(parseInt(d.min)||0)*60+(parseInt(d.sec)||0);if(!s){err.textContent="מלא זמן סיום בדקות ושניות.";return}if((parseInt(d.sec)||0)>59){err.textContent="שניות צריכות להיות בין 0 ל-59.";return}result={seconds:s}}
  }else if(d.format==="amrap"){const r=parseInt(d.rounds)||0,p=parseInt(d.reps)||0;if(!r&&!p){err.textContent="מלא כמה סיבובים עשית.";return}result={rounds:r,reps:p}}
  else{
    const named=d.exercises.filter(e=>e.name.trim());
    if(!named.length){err.textContent="כתוב שם לפחות לתרגיל אחד.";return}
    const exercises=named.map(e=>({name:e.name.trim().slice(0,40),sets:(()=>{let prev=0;return toSets(e).map(s=>{const raw=String(s.kg).trim();const kg=raw===""?prev:Math.max(0,parseFloat(raw)||0);prev=kg;return{reps:parseInt(s.reps)||0,kg}})})().filter(s=>s.reps>0)}));
    const empty=exercises.find(e=>!e.sets.length);
    if(empty){err.textContent=`ב"${empty.name}" חסר מספר חזרות.`;return}
    result={exercises};
    if(!d.title.trim())d.title=exercises.slice(0,2).map(e=>e.name).join(" + ")+(exercises.length>2?" ועוד":"");
  }
  const w={id:uuid(),userId:S.meId,format:d.format,title:d.title.trim().slice(0,80),rx:d.format==="strength"?false:!!d.rx,result,notes:d.notes.trim().slice(0,200),wodId:d.wodId,createdAt:Date.now(),reactions:{}};
  if(d.format!=="strength")w.plan=d.plan.trim().slice(0,800);
  if(d.format==="amrap"&&parseInt(d.amrapMin))w.durationMin=Math.min(180,parseInt(d.amrapMin));
  if(d.copiedFrom)w.copiedFrom=d.copiedFrom;
  // into the outbox first, so nothing is lost even if the app closes right now
  writeOutbox(readOutbox().concat([toRow(w)]));
  clearDraftLocal();draft=null;$("#sheetHost").innerHTML="";
  w.pendingSync=true;S.workouts.unshift(w);S.tab=d.wodId?"wod":"feed";render();window.scrollTo(0,0);
  await flushOutbox();
  toast(readOutbox().some(x=>x.id===w.id)?"נשמר בטלפון. יישלח לחברים כשתחזור לקליטה":"נשמר ושותף עם כולם");
}

async function toggleHf(id){

/* ---------- paste a workout as text (e.g. copied from a screenshot) ---------- */
// Turns free text like "Back squat 5x5 @100kg" or "AMRAP 20: 5 pull-ups..." into a draft.
// Rule-based on purpose: free, offline, and nothing leaves the phone.
const KG_RE=/(\d+(?:[.,]\d+)?)\s*(kg|kgs|ק"ג|ק״ג|קג|קילו|lbs?|#)/i;
function toKg(n,unit){let v=parseFloat(String(n).replace(",","."));if(/lb|#/i.test(unit||""))v=Math.round(v*0.4536*2)/2;return v}
function cleanName(s){
  return s.replace(/^\s*(?:[-•*·▪►>]+|\(?[a-zא-ת]\d?\)|\d{1,2}[.)])\s*/i,"")   // bullets, "A1)", "1."
    .replace(/\d+\s*[x×*]\s*\d+(?:\s*[x×*]\s*\d+(?:[.,]\d+)?)?/gi," ")
    .replace(/\d+\s*(?:sets?|סטים|סט)\s*(?:of|של|x|×)?\s*\d*/gi," ")
    .replace(/\b\d+(?:\s*[-/]\s*\d+){2,}\b/g," ")
    .replace(new RegExp(KG_RE.source,"gi")," ").replace(/@\s*\d+(?:[.,]\d+)?\s*%?/g," ")
    .replace(/(^|\s)(?:reps?|חזרות|kgs?|lbs?|ק"ג|ק״ג|קג|[@x×*%])(?=\s|$)/gi," ")
    .replace(/[\s:–—\-,|]+$/,"").replace(/^[\s:–—\-,|]+/,"")
    .replace(/\s{2,}/g," ").trim();
}
// one line -> {name, sets:[{reps,kg}]} or null
function parseStrengthLine(line){
  const L=line.replace(/[–—]/g,"-");
  let kg=0;const km=L.match(KG_RE);if(km)kg=toKg(km[1],km[2]);
  const at=L.match(/@\s*(\d+(?:[.,]\d+)?)(?![\d.,]*\s*%)/);if(!km&&at)kg=toKg(at[1]);
  let sets=null;
  let m=L.match(/(\d+)\s*[x×*]\s*(\d+)(?:\s*[x×*]\s*(\d+(?:[.,]\d+)?))?/i);         // 5x5, 4x8x70
  if(m){const a=+m[1],b=+m[2];if(m[3]&&!kg)kg=toKg(m[3]);
    // sets x reps (the usual convention); only flip when the first number can't be a set count
    const n=a<=12?a:b,reps=a<=12?b:a;
    sets=Array.from({length:Math.min(n,12)},()=>({reps,kg}))}
  if(!sets){m=L.match(/(\d+)\s*(?:sets?|סטים|סט)\s*(?:of|של|x|×)?\s*(\d+)/i);
    if(m)sets=Array.from({length:Math.min(+m[1],12)},()=>({reps:+m[2],kg}))}
  if(!sets){m=L.match(/\b(\d+(?:\s*[-/]\s*\d+){2,})\b/);                                  // 5-5-3-3-1 or 5/3/1
    if(m){const reps=m[1].split(/[-/]/).map(x=>+x.trim());
      let kgs=null;const w=L.slice(m.index+m[0].length).match(/(\d+(?:[.,]\d+)?(?:\s*[-/]\s*\d+(?:[.,]\d+)?){1,})\s*(kg|ק"ג|lbs?)?/i);
      if(w){const ks=w[1].split(/[-/]/).map(x=>toKg(x,w[2]));if(ks.length===reps.length)kgs=ks}
      sets=reps.map((r,i)=>({reps:r,kg:kgs?kgs[i]:kg}))}}

}
function parseWorkoutText(raw){
  const rawLines=String(raw||"").replace(/\r/g,"").split("\n").map(s=>s.replace(/\s+$/,""));
  const lines=rawLines.filter(s=>s.trim());
  if(!lines.length)return null;
  const all=lines.join("\n");
  const isHeader=s=>/^\s*(amrap|for time|rft|emom|e\d+mom|every|tabata|\d+\s*rounds?|time cap|cap|work|כמה שיותר|סבבים|סיבובים|על זמן)/i.test(s)||/(amrap|for time)\s*[:\-]?\s*$/i.test(s);
  const amrap=/amrap|as many rounds|כמה שיותר סבבים|כמה שיותר סיבובים/i.test(all);
  const metconWords=/for time|\brft\b|rounds?\b|סבבים|סיבובים|על זמן|לזמן|נגד השעון|emom|e\d+mom|every\s+\d|tabata|time cap|\bcap\b|קאפ|rest\s+\d|מנוחה|\bcals?\b|קלוריות|\b\d{1,2}:\d{2}\b/i.test(all);
  // strength lines carry a sets scheme (5x5, 4 sets of 8, 5/3/1); metcon lines start with a rep count ("21 KB swings")
  const parsed=lines.map(parseStrengthLine);
  const withSets=parsed.filter(p=>p&&p.sets&&p.sets.length).length;
  const repsFirst=lines.filter(l=>/^\s*\d+\s*(?:x\s*)?[a-zA-Zא-ת]/.test(l)&&!/\d\s*[x×*]\s*\d/.test(l)).length;
  const strengthLike=withSets>=2||(withSets>=1&&withSets>=repsFirst);
  const explicitTime=/for time|\brft\b|על זמן|לזמן|נגד השעון/i.test(all);
  if(amrap||explicitTime||(!strengthLike&&(metconWords||repsFirst>=2))||(!strengthLike&&!withSets)){
    const fmt=amrap?"amrap":"time";
    let minutes=null;
    const mm=all.match(/amrap\s*(?:of|in|-|:)?\s*(\d{1,3})|(\d{1,3})\s*(?:min(?:ute)?s?|'|דק(?:ות|')?)\s*amrap|amrap[^\n]{0,20}?(\d{1,3})\s*(?:min|'|דק)/i);
    if(mm)minutes=+(mm[1]||mm[2]||mm[3]);
    let title="";const first=lines[0].trim();let firstIsTitle=false;
    if(!/\d/.test(first)&&lines.length>1&&first.length<=40&&!/^(for time|amrap|emom|tabata)\b/i.test(first)){title=first.replace(/^["'“”״׳]+|["'“”״׳]+[:]?$/g,"").replace(/:$/,"").trim();firstIsTitle=true}
    const amrapHead=/^\s*(?:\d{1,3}\s*(?:min\w*|'|דק\S*)\s*)?amrap(?:\s*(?:of|in)?\s*\d{0,3}\s*(?:min\w*|'|דק\S*)?)?\s*[:\-]?\s*$/i;
    // keep the original layout (blank lines between blocks), minus the title line and a bare "AMRAP 20" header
    let skippedTitle=false;
    const body=rawLines.filter(l=>{
      if(firstIsTitle&&!skippedTitle&&l.trim()){skippedTitle=true;return false}
      return !(fmt==="amrap"&&amrapHead.test(l));
    }).join("\n").replace(/\n{3,}/g,"\n\n").trim();
    const rounds=all.match(/(\d+)\s*(?:rounds?|סבבים|סיבובים)/i);
    // a generic header ("Work", "WOD") or no header at all: name it after the movements instead
    const generic=/^(work|wod|metcon|workout|conditioning|part\s*[a-z\d]|אימון|מטקון)$/i;
    if(!title||generic.test(title)){
      const moves=lines.filter(l=>/^\s*\d+\s*(?:x\s*)?(?:cals?\s+|m\s+)?[a-zA-Zא-ת]/.test(l)&&!/rounds?|סבבים|rest|מנוחה/i.test(l))
        .map(l=>/^\s*\d+\s*(?:m|km|cals?|kcal)\b/i.test(l)?l.trim():l.replace(/^\s*\d+\s*(?:x\s*)?/,""))
        .map(l=>l.replace(KG_RE,"").replace(/\s{2,}/g," ").trim()).filter(Boolean).slice(0,3);
      if(moves.length)title=((rounds?`${rounds[1]} סבבים: `:"")+moves.join(" · ")).slice(0,80);
    }
    return{format:fmt,title,plan:body,amrapMin:minutes?String(minutes):"",exercises:null,found:lines.length,
      guessed:!amrap&&!/for time|\brft\b|על זמן|לזמן|נגד השעון/i.test(all),rounds:rounds?+rounds[1]:null,
      special:/emom|e\d+mom|every\s+\d|tabata/i.test(all)};
  }
  // strength: one exercise per line; a name line followed by a numbers-only line is merged
  const out=[];let title="";
  for(let i=0;i<lines.length;i++){
    const p=parsed[i];if(!p)continue;
    if(!p.sets){
      const nx=parsed[i+1]||null;
      if(nx&&nx.sets&&!nx.name){out.push({name:p.name,sets:nx.sets});i++;continue}
      if(i===0&&!title){title=p.name;continue}
      out.push({name:p.name,sets:[]});continue;
    }
    if(!p.name&&out.length&&!out[out.length-1].sets.length){out[out.length-1].sets=p.sets;continue}
    out.push({name:p.name||"תרגיל",sets:p.sets});
  }
  const ex=out.filter(e=>e.name).slice(0,8);
  return{format:"strength",title,plan:"",amrapMin:"",exercises:ex,found:ex.length,missing:ex.filter(e=>!e.sets.length).length};
}

/* ---------- loading data from Supabase ---------- */
function fromRow(r){
  return{id:r.id,userId:r.user_id,createdAt:Date.parse(r.created_at),format:r.format,title:r.title,rx:!!r.rx,result:r.result||{},notes:r.notes||"",
    plan:r.plan||"",durationMin:r.duration_min||null,wodId:r.wod_id||null,
    copiedFrom:(r.copied_from_id||r.copied_from_user)?{id:r.copied_from_id,userId:r.copied_from_user}:null,reactions:{}};
}
async function refetch(){
  const sb=S.sb;
  const [w,r,d,p]=await Promise.all([
    sb.from("workouts").select("*").order("created_at",{ascending:false}).limit(1000),
    sb.from("reactions").select("workout_id,user_id"),
    sb.from("wods").select("*").order("created_at",{ascending:false}).limit(20),
    sb.from("profiles").select("id,name,created_at")
  ]);
  const err=w.error||r.error||d.error||p.error;
  if(err){S.connErr=isNetworkError(err)?"offline":"error";render();return}
  S.connErr=false;
  const byId={};const list=w.data.map(fromRow);list.forEach(x=>byId[x.id]=x);
  r.data.forEach(x=>{if(byId[x.workout_id])byId[x.workout_id].reactions[x.user_id]=true});
  // workouts still waiting in the outbox stay visible
  readOutbox().filter(x=>x.user_id===S.meId&&!byId[x.id]).forEach(x=>{const o=fromRow(x);o.pendingSync=true;list.push(o)});
  list.sort((a,b)=>b.createdAt-a.createdAt);
  S.workouts=list;
  S.wods=d.data.map(x=>({id:x.id,title:x.title,description:x.description,format:x.format,cap:x.cap,createdBy:x.created_by,createdAt:Date.parse(x.created_at),weekStart:weekStart(Date.parse(x.created_at))}));
  S.names={};p.data.forEach(x=>S.names[x.id]=x.name);
  S.members=p.data.map(x=>({id:x.id,name:x.name,joinedAt:Date.parse(x.created_at)||0}));
  S.meName=S.names[S.meId]||S.meName;
  try{localStorage.setItem("wb.cache.v1",JSON.stringify({me:S.meId,at:Date.now(),workouts:S.workouts,wods:S.wods,names:S.names,members:S.members}))}catch(e){}
  S.mode="live";render();
}
let refetchTimer=0;
function scheduleRefetch(ms=500){clearTimeout(refetchTimer);refetchTimer=setTimeout(refetch,ms)}

/* ---------- sign-in, sign-up and joining the group ---------- */
function authErrorText(e){
  const m=String(e&&e.message||e||"");
  if(/invalid login credentials/i.test(m))return"מייל או סיסמה לא נכונים.";
  if(/already registered|already exists/i.test(m))return"כבר יש חשבון עם המייל הזה. עבור ל\"כניסה\".";
  if(/password.*(6|short|least)/i.test(m))return"הסיסמה צריכה להיות לפחות 6 תווים.";
  if(/email.*invalid|invalid.*email|unable to validate email/i.test(m))return"כתובת המייל לא תקינה.";
  if(/email not confirmed/i.test(m))return"המייל לא אומת. בעל האפליקציה צריך לכבות את \"Confirm email\" ב-Supabase (ראה הוראות).";
  if(/bad_code/.test(m))return"קוד ההצטרפות לא נכון. בקש אותו ממי ששלח לך את האפליקציה.";
  if(/name_required/.test(m))return"כתוב את השם שלך.";
  if(/rate limit|too many/i.test(m))return"יותר מדי ניסיונות. חכה דקה ונסה שוב.";
  if(isNetworkError(e))return"אין חיבור לאינטרנט.";
  return"משהו השתבש: "+m;
}
let authMode="login";
function showAuth(mode,msg){
  authMode=mode||authMode;
  $("#app").hidden=true;$("#tabs").hidden=true;
  const join=authMode==="join";
  $("#gate").hidden=false;
  $("#gate").innerHTML=`<div class="gatebox">
    <img src="icon-192.png" alt="" width="72" height="72" class="gateicon">
    <h1 class="brand">הלוח של החבר'ה</h1>
    <p class="gatesub">${join?"עוד צעד אחד: הצטרפות לקבוצה.":"רושמים אימונים, משתפים ולומדים אחד מהשני."}</p>
    ${join?"":`<div class="seg two" role="tablist"><button type="button" aria-pressed="${authMode==="login"}" data-auth="login">כניסה</button><button type="button" aria-pressed="${authMode==="signup"}" data-auth="signup">הרשמה</button></div>`}
    <form id="authForm" class="gateform" novalidate>
      ${authMode!=="login"?`<label class="f">השם שלך (כך החברים יראו אותך)<input id="a-name" autocomplete="nickname" maxlength="30" value="${esc(S.meName||"")}"></label>`:""}
      ${join?"":`<label class="f">מייל<input id="a-email" type="email" inputmode="email" autocomplete="email" dir="ltr"></label>
      <label class="f">סיסמה${authMode==="signup"?" (לפחות 6 תווים)":""}<input id="a-pass" type="password" autocomplete="${authMode==="signup"?"new-password":"current-password"}" dir="ltr"></label>`}
      ${authMode!=="login"?`<label class="f">קוד הצטרפות לקבוצה<input id="a-code" autocomplete="off" dir="ltr"></label>`:""}
      <div class="err" id="a-err" role="alert">${esc(msg||"")}</div>
      <button class="btn" type="submit" id="a-btn">${authMode==="login"?"כניסה":authMode==="signup"?"הרשמה והצטרפות":"הצטרף"}</button>
      ${join?`<button type="button" class="linkbtn" data-act="logout">התנתק</button>`:""}
    </form>
    ${authMode==="login"?`<p class="gatesub small">שכחת סיסמה? בקש ממי שמנהל את האפליקציה לאפס אותה.</p>`:""}
  </div>`;
}
async function submitAuth(){
  const err=$("#a-err"),btn=$("#a-btn");err.textContent="";
  const v=id=>{const e=$(id);return e?e.value.trim():""};
  const email=v("#a-email"),pass=$("#a-pass")?$("#a-pass").value:"",name=v("#a-name"),code=v("#a-code");
  if(authMode!=="join"&&(!email||!pass)){err.textContent="מלא מייל וסיסמה.";return}
  if(authMode!=="login"&&!name){err.textContent="כתוב את השם שלך.";return}
  if(authMode!=="login"&&!code){err.textContent="חסר קוד הצטרפות. בקש אותו ממי ששלח לך את האפליקציה.";return}
  btn.disabled=true;btn.textContent="רגע…";
  try{
    if(authMode==="login"){
      const {data,error}=await S.sb.auth.signInWithPassword({email,password:pass});if(error)throw error;
      await afterSignIn(data.session);return;
    }
    if(authMode==="signup"){
      const {data,error}=await S.sb.auth.signUp({email,password:pass});if(error)throw error;
      if(!data.session)throw new Error("email not confirmed");
      S.session=data.session;S.meId=data.session.user.id;
    }
    const {error:jerr}=await S.sb.rpc("join_group",{p_code:code,p_name:name});if(jerr)throw jerr;
    S.meName=name;await afterSignIn(S.session||(await S.sb.auth.getSession()).data.session);
  }catch(e){
    btn.disabled=false;btn.textContent=authMode==="login"?"כניסה":authMode==="signup"?"הרשמה והצטרפות":"הצטרף";
    err.textContent=authErrorText(e);
    // the account exists already; keep what was typed and continue on the join step
    if(authMode==="signup"&&S.session){S.meName=name;showAuth("join",authErrorText(e));const c=$("#a-code");if(c){c.value=code;c.focus();c.select()}}
  }
}
async function afterSignIn(session){
  if(!session){showAuth("login");return}
  S.session=session;S.meId=session.user.id;
  const {data,error}=await S.sb.from("profiles").select("id,name").eq("id",S.meId).maybeSingle();
  if(error&&!isNetworkError(error)){showAuth("login",authErrorText(error));return}
  if(!data&&!error){showAuth("join");return}
  if(data)S.meName=data.name;
  $("#gate").hidden=true;$("#gate").innerHTML="";$("#app").hidden=false;$("#tabs").hidden=false;
  render();
  startLive();
}
let liveStarted=false;
function startLive(){
  if(liveStarted)return;liveStarted=true;
  refetch().then(flushOutbox);
  S.sb.channel("board").on("postgres_changes",{event:"*",schema:"public"},()=>scheduleRefetch()).subscribe();
  window.addEventListener("online",()=>{flushOutbox();scheduleRefetch(0)});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){flushOutbox();scheduleRefetch(0)}});
}
async function logout(){
  await S.sb.auth.signOut().catch(()=>{});
  try{["wb.cache.v1","wb.tab","wb.draft.v2"].forEach(k=>localStorage.removeItem(k))}catch(e){}
  location.reload();
}
async function renameMe(){
  const inp=$("#me-name");const name=inp.value.trim().slice(0,30);if(!name||name===S.meName)return;

  if(!window.supabase||!cfg.SUPABASE_URL||/YOUR-/.test(cfg.SUPABASE_URL+cfg.SUPABASE_ANON_KEY)){
    $("#app").hidden=true;$("#tabs").hidden=true;$("#gate").hidden=false;
    $("#gate").innerHTML=`<div class="gatebox"><h1 class="brand">כמעט מוכן</h1><p class="gatesub">${!window.supabase?"לא הצלחתי לטעון את הספרייה של Supabase. בדוק את החיבור לאינטרנט ורענן.":"צריך למלא את הכתובת והמפתח של Supabase בקובץ config.js (ראה הוראות ההתקנה)."}</p></div>`;
    return;
  }
  S.sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const {data}=await S.sb.auth.getSession();
  if(!data.session){showAuth("login");return}
  // show the last saved copy immediately (also works without reception), then load fresh data
  try{const c=JSON.parse(localStorage.getItem("wb.cache.v1")||"null");if(c&&c.me===data.session.user.id){S.workouts=c.workouts;S.wods=c.wods;S.names=c.names;S.members=c.members||[];S.meId=c.me;S.meName=c.names[c.me]||"";S.mode="live";$("#gate").hidden=true;$("#gate").innerHTML="";$("#app").hidden=false;$("#tabs").hidden=false;render()}}catch(e){}
  await afterSignIn(data.session);
})();
</script>
</body>
</html>
